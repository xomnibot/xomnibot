      .r2{transform:translateX(142.8px);animation:r2 24s linear infinite}
      @keyframes n2{0%,66.29%{opacity:0}66.30%,100%{opacity:1}}
      .n2{animation:n2 24s step-end infinite}
      @keyframes b2{0%,67.96%{opacity:0}67.96%,100%{opacity:1}}
      .b2{animation:b2 24s step-end infinite}
      @keyframes f2{0%,67.96%{transform:translateX(0);animation-timing-function:steps(24,end)}77.12%,100%{transform:translateX(201.6px)}}
      .f2{transform:translateX(201.6px);animation:f2 24s linear infinite}
      @keyframes d2{0%,77.12%{opacity:0}77.13%,100%{opacity:1}}
      .d2{animation:d2 24s step-end infinite}
      @keyframes pe{0%,79.62%{opacity:0}79.63%,100%{opacity:1}}
      .pe{animation:pe 24s step-end infinite}
      @keyframes cur{0%{transform:translate(22px,53px);animation-timing-function:step-end}3.33%{transform:translate(164.8px,53px);animation-timing-function:step-end}6.25%{transform:translate(164.8px,53px);animation-timing-function:steps(18,end)}11.50%{transform:translate(316px,53px);animation-timing-function:step-end}12.13%{transform:translate(22px,75px);animation-timing-function:step-end}13.58%{transform:translate(22px,97px);animation-timing-function:step-end}15.25%{transform:translate(324.4px,97px);animation-timing-function:step-end}26.92%{transform:translate(164.8px,119px);animation-timing-function:step-end}29.83%{transform:translate(164.8px,119px);animation-timing-function:steps(38,end)}40.92%{transform:translate(484px,119px);animation-timing-function:step-end}41.54%{transform:translate(22px,141px);animation-timing-function:step-end}43.00%{transform:translate(22px,163px);animation-timing-function:step-end}44.67%{transform:translate(324.4px,163px);animation-timing-function:step-end}56.33%{transform:translate(164.8px,185px);animation-timing-function:step-end}59.25%{transform:translate(164.8px,185px);animation-timing-function:steps(17,end)}64.21%{transform:translate(307.6px,185px);animation-timing-function:step-end}64.83%{transform:translate(22px,207px);animation-timing-function:step-end}66.29%{transform:translate(22px,229px);animation-timing-function:step-end}67.96%{transform:translate(324.4px,229px);animation-timing-function:step-end}79.62%{transform:translate(164.8px,251px);animation-timing-function:step-end}100%{transform:translate(164.8px,251px)}}
      .cur{transform:translate(164.8px,251px);animation:cur 24s linear infinite}
