<svg xmlns="http://www.w3.org/2000/svg" width="840" height="286" viewBox="0 0 840 286" role="img" aria-label="Animated terminal typing lab-only recon, model training and reversing commands">
  <defs>
    <style>
      text{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
      .pr{fill:#22C55E;font-weight:700}
