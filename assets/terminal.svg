    <g class="p1"><text x="22" y="132" class="pr" xml:space="preserve" textLength="142.8" lengthAdjust="spacing">lab@localhost:~$ </text><text x="164.8" y="132" class="cmd" xml:space="preserve" textLength="319.2" lengthAdjust="spacing">python train.py --config baseline.yaml</text><rect x="164.8" y="117" width="319.2" height="22" fill="#03130A" class="r1"/></g>
    <g class="n1"><text x="22" y="154" class="note" xml:space="preserve" textLength="352.8" lengthAdjust="spacing"># config: baseline.yaml, device: localhost</text></g>
    <g class="b1"><text x="22" y="176" class="out" xml:space="preserve" textLength="92.4" lengthAdjust="spacing">training  [</text><text x="114.4" y="176" class="bar" xml:space="preserve" textLength="201.6" lengthAdjust="spacing">########################</text><rect x="114.4" y="161" width="201.6" height="22" fill="#03130A" class="f1"/><text x="316" y="176" class="out" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">]</text></g>
    <g class="d1"><text x="332.8" y="176" class="out" xml:space="preserve" textLength="33.6" lengthAdjust="spacing">done</text></g>
    <g class="p2"><text x="22" y="198" class="pr" xml:space="preserve" textLength="142.8" lengthAdjust="spacing">lab@localhost:~$ </text><text x="164.8" y="198" class="cmd" xml:space="preserve" textLength="142.8" lengthAdjust="spacing">ghidra sample.bin</text><rect x="164.8" y="183" width="142.8" height="22" fill="#03130A" class="r2"/></g>
    <g class="n2"><text x="22" y="220" class="note" xml:space="preserve" textLength="243.6" lengthAdjust="spacing"># sample: lab training binary</text></g>
    <g class="b2"><text x="22" y="242" class="out" xml:space="preserve" textLength="92.4" lengthAdjust="spacing">analyzing [</text><text x="114.4" y="242" class="bar" xml:space="preserve" textLength="201.6" lengthAdjust="spacing">########################</text><rect x="114.4" y="227" width="201.6" height="22" fill="#03130A" class="f2"/><text x="316" y="242" class="out" xml:space="preserve" textLength="8.4" lengthAdjust="spacing">]</text></g>
    <g class="d2"><text x="332.8" y="242" class="out" xml:space="preserve" textLength="33.6" lengthAdjust="spacing">done</text></g>
    <g class="pe"><text x="22" y="264" class="pr" xml:space="preserve" textLength="142.8" lengthAdjust="spacing">lab@localhost:~$ </text></g>
