  <rect x="1" y="1" width="838" height="284" rx="10" fill="#03130A" stroke="#14532D" stroke-width="2"/>
  <path d="M2 34V11a9 9 0 0 1 9-9H829a9 9 0 0 1 9 9V34Z" fill="#052E16"/>
  <circle cx="20" cy="18" r="5" fill="#4ADE80"/><circle cx="38" cy="18" r="5" fill="#22C55E"/><circle cx="56" cy="18" r="5" fill="#14532D"/>
