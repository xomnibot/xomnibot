      .note{fill:#16A34A}
      .out{fill:#BBF7D0}
      .bar{fill:#4ADE80}
      .ttl{fill:#6EE7A0;font-size:12px}
      .blk{fill:#4ADE80;animation:blk 1.1s steps(2) infinite}
      @keyframes blk{50%{opacity:0}}
      @keyframes p0{0%,3.33%{opacity:0}3.34%,100%{opacity:1}}
      .p0{animation:p0 24s step-end infinite}
      @keyframes r0{0%,6.25%{transform:translateX(0);animation-timing-function:steps(18,end)}11.50%,100%{transform:translateX(151.2px)}}
      .r0{transform:translateX(151.2px);animation:r0 24s linear infinite}
      @keyframes n0{0%,13.58%{opacity:0}13.59%,100%{opacity:1}}
      .n0{animation:n0 24s step-end infinite}
      @keyframes b0{0%,15.25%{opacity:0}15.25%,100%{opacity:1}}
      .b0{animation:b0 24s step-end infinite}
      @keyframes f0{0%,15.25%{transform:translateX(0);animation-timing-function:steps(24,end)}24.42%,100%{transform:translateX(201.6px)}}
      .f0{transform:translateX(201.6px);animation:f0 24s linear infinite}
      @keyframes d0{0%,24.42%{opacity:0}24.42%,100%{opacity:1}}
      .d0{animation:d0 24s step-end infinite}
      @keyframes p1{0%,26.92%{opacity:0}26.92%,100%{opacity:1}}
      .p1{animation:p1 24s step-end infinite}
      @keyframes r1{0%,29.83%{transform:translateX(0);animation-timing-function:steps(38,end)}40.92%,100%{transform:translateX(319.2px)}}
      .r1{transform:translateX(319.2px);animation:r1 24s linear infinite}
      @keyframes n1{0%,43.00%{opacity:0}43.00%,100%{opacity:1}}
      .n1{animation:n1 24s step-end infinite}
      @keyframes b1{0%,44.67%{opacity:0}44.67%,100%{opacity:1}}
      .b1{animation:b1 24s step-end infinite}
      @keyframes f1{0%,44.67%{transform:translateX(0);animation-timing-function:steps(24,end)}53.83%,100%{transform:translateX(201.6px)}}
      .f1{transform:translateX(201.6px);animation:f1 24s linear infinite}
      @keyframes d1{0%,53.83%{opacity:0}53.84%,100%{opacity:1}}
      .d1{animation:d1 24s step-end infinite}
      @keyframes p2{0%,56.33%{opacity:0}56.34%,100%{opacity:1}}
      .p2{animation:p2 24s step-end infinite}
